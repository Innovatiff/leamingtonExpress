# Publishes the website (store, admin and employee apps) to Firebase Hosting from GitHub —
# no terminal needed and no limit on how often. Runs by itself when the website changes on
# the branch Netlify publishes. To publish again by hand: GitHub → Actions → "Deploy
# website" → Run workflow. Uses the same FIREBASE_SERVICE_ACCOUNT secret as the functions.
name: Deploy website

on:
  push:
    branches: [claude/funny-hawking-g7g3st, main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "admin.html"
      - "equipo.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".env"
      - "firebase.json"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: express-corp
      FIREBASE_TOOLS: firebase-tools@15.33.0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check and build the website
        env:
          # Photo uploads in the admin (Cloudinary): the same value as in Netlify's environment
          # variables, saved in GitHub → Settings → Secrets and variables → Actions → Variables
          VITE_CLOUDINARY_PRESET: ${{ vars.VITE_CLOUDINARY_PRESET }}
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Google Cloud key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret first (README → Going live)."
            exit 1
          fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/key.json" >> "$GITHUB_ENV"

      - name: Publish
        run: npx --yes "$FIREBASE_TOOLS" deploy --only hosting --non-interactive --project "$PROJECT"

      # a new release (and the very first one) can take a moment to be served everywhere
      - name: Check it's online
        run: |
          for path in / /tienda/productos /admin /equipo; do
            ok=""
            for try in $(seq 1 12); do
              if curl -fsS "https://$PROJECT.web.app$path" | grep -q "<title>"; then ok=1; break; fi
              sleep 10
            done
            [ -n "$ok" ] || { echo "::error::$path didn't load"; exit 1; }
          done
          echo "Online at https://$PROJECT.web.app"

      # What Firebase says about each custom domain (leamingtonexpress.ca, www…) and the DNS
      # records it still needs. Read only, and never fails the deploy.
      - name: Custom domain status
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/domains.mjs" <<'EOF'
          import { readFileSync } from "node:fs";
          import { sign } from "node:crypto";

          const key = JSON.parse(readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, "utf8"));
          const now = Math.floor(Date.now() / 1000);
          const part = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
          const claims = { iss: key.client_email, scope: "https://www.googleapis.com/auth/firebase.readonly", aud: "https://oauth2.googleapis.com/token", iat: now, exp: now + 600 };
          const unsigned = `${part({ alg: "RS256", typ: "JWT" })}.${part(claims)}`;
          const assertion = `${unsigned}.${sign("RSA-SHA256", Buffer.from(unsigned), key.private_key).toString("base64url")}`;
          const auth = await fetch("https://oauth2.googleapis.com/token", {
            method: "POST",
            body: new URLSearchParams({ grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", assertion }),
          }).then((r) => r.json());
          if (!auth.access_token) throw new Error(`No token: ${auth.error_description || auth.error}`);
          const get = (path) =>
            fetch(`https://firebasehosting.googleapis.com/v1beta1/${path}`, { headers: { authorization: `Bearer ${auth.access_token}` } }).then((r) => r.json());

          const project = process.env.PROJECT;
          const { sites = [], error } = await get(`projects/${project}/sites`);
          if (error) throw new Error(error.message);
          for (const site of sites) {
            const id = site.name.split("/").pop();
            const list = await get(`projects/${project}/sites/${id}/customDomains`);
            if (list.error) {
              console.log(`site ${id}: ${list.error.message}`);
              continue;
            }
            console.log(`site ${id}: ${(list.customDomains || []).length} custom domain(s)`);
            for (const d of list.customDomains || []) {
              console.log(`\n${d.name.split("/").pop()}${d.redirectTarget ? ` → redirects to ${d.redirectTarget}` : ""}`);
              console.log(`  host: ${d.hostState} | ownership: ${d.ownershipState} | certificate: ${d.cert?.state}`);
              for (const i of [...(d.issues || []), ...(d.cert?.issues || [])]) console.log(`  issue: ${i.message}`);
              for (const set of d.requiredDnsUpdates?.desired || []) {
                for (const rec of set.records || []) {
                  if (rec.requiredAction && rec.requiredAction !== "NONE") console.log(`  DNS to ${rec.requiredAction.toLowerCase()}: ${rec.type} ${rec.domainName} ${rec.rdata}`);
                }
                if (set.checkError) console.log(`  DNS check: ${set.checkError.message}`);
              }
            }
          }
          EOF
          node "$RUNNER_TEMP/domains.mjs"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/key.json"
