# Deploys the Cloud Functions (functions/) to Firebase from GitHub — no terminal needed.
# Runs by itself when functions/ changes on the branch Netlify publishes. To deploy
# again by hand: GitHub → Actions → "Deploy Cloud Functions" → latest run → Re-run all jobs.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (README → Going live).
name: Deploy Cloud Functions

on:
  push:
    branches: [claude/funny-hawking-g7g3st, main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: express-corp
      FIREBASE_TOOLS: firebase-tools@15.33.0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install and test the functions
        run: |
          npm ci --prefix functions
          npm --prefix functions test

      - name: Google Cloud key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret first (README → Going live)."
            exit 1
          fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/key.json" >> "$GITHUB_ENV"

      # Old container images are deleted after a day, so they don't add up on the bill
      - name: Cleanup policy for old images
        continue-on-error: true
        run: npx --yes "$FIREBASE_TOOLS" functions:artifacts:setpolicy --location us-central1 --days 1 --force --non-interactive --project "$PROJECT"

      # Deploys exactly the functions in this code. Other functions already in the project
      # (like the old createCheckoutSession) are left alone: never deleted, never in the way.
      - name: Deploy
        run: |
          ONLY=$(node -e 'console.log(Object.keys(require("./functions")).map((name) => `functions:${name}`).join(","))')
          echo "Deploying: $ONLY"
          npx --yes "$FIREBASE_TOOLS" deploy --only "$ONLY" --non-interactive --project "$PROJECT"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/key.json"
