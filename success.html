<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
    <script defer type="module" src="src/app.js"></script>
    <script defer type="module" src="src/success.js"></script>
    <title>Leamington Express | Order Success ✅</title>
  </head>
  <body>
    <div class="homepage">
      <section class="phsuccess">
        <div class="phsuccess__container">
          <a href="index.html" class="phsuccess__home"
            ><span>Página principal</span>
            <i class="ph ph-arrow-right"></i>
          </a>
          <div class="phsuccess__logo">
            <img src="img/log-light-removebg-preview.png" alt="" />
            <img src="img/logo-white-leamington.png" alt="" />
          </div>
          <h2 class="phsuccess__heading">Confirmacion de <br />su pedido ✅</h2>
          <div class="phsuccess__message">
            <span class="phsuccess__message--greeting">Saludos,</span>
            <span class="phsuccess__message--message">
              Gracias por su compra con nosotros. Hemos recibido su pedido
              <strong class="phsuccess__message--order-number">Nº: --</strong>.
              Le notificaremos cualquier actualización o inconveniente.
            </span>
          </div>

          <h4 class="phsuccess__order--heading">Resumen del pedido</h4>

          <div class="phsuccess__orders">
            <div class="phsuccess__orders-list"></div>

            <div class="phsuccess__details">
              <div class="phsuccess__details--boxes">
                <div class="phsuccess__details--box">
                  <span>Subtotal</span>
                  <p class="phsuccess__details--box-subtotal">$0.00</p>
                </div>
                <div class="phsuccess__details--box">
                  <span>Ahorros</span>
                  <p class="phsuccess__details--box-saved">$0.00</p>
                </div>
                <div class="phsuccess__details--box">
                  <span>Envío</span>
                  <p class="phsuccess__details--box-delivery">$0.00</p>
                </div>
                <div class="phsuccess__details--box">
                  <span>Impuestos</span>
                  <p class="phsuccess__details--box-tax">$0.00</p>
                </div>
              </div>

              <div class="phsuccess__details--box phsuccess__details--box-sp">
                <span>Total</span>
                <p class="phsuccess__details--box-total">$0.00</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
